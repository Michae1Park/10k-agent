# V7 LoRA fine-tune of the 9B agent model (docs/FINETUNE.md). One L40S (46 GB).
# Run: scripts/finetune.sh train   (or: uv run --extra finetune python finetune/train.py)

base_model: Qwen/Qwen3.5-9B
data: data/train/sft.jsonl              # from `tenk finetune dataset`
output_dir: data/finetune/v7            # adapter in <output_dir>/adapter, merged model in /merged
enable_thinking: false                  # must match how the model is served and evaluated
max_length: 38400                       # longer samples are dropped, never truncated; 38.3k
                                        # tokens peaked at 41.3 GiB of 44.4 (tested)
eval_fraction: 0.05                     # held-out samples for eval loss
seed: 7

lora:
  r: 16
  alpha: 32
  dropout: 0.0                          # dropout keeps a copy of each layer input: OOM at 38k
  # Language model only (the vision tower is untouched): full-attention, linear-attention
  # (Gated DeltaNet) and MLP projections.
  target_modules: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|out_proj|gate_proj|up_proj|down_proj)'

train:
  epochs: 2
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  gradient_accumulation_steps: 8          # batch size 1 (one trajectory), 8 per update
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
  gradient_checkpointing: true
