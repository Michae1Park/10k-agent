[project]
name = "tenk-agent"
version = "0.1.0"
description = "Agentic research assistant for grounded, cited answers over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
tenk = "tenk_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
