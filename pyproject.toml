[project]
name = "tenk-agent"
version = "0.1.0"
description = "Grounded, cited answers over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "langgraph>=1.2.17",
    "lxml>=5.0",
    "numpy>=2.5.3",
    "openai>=3.22.1",
    "openpyxl>=3.1.5",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
tenk = "tenk_agent.cli:main"

[project.optional-dependencies]
# Local embedder, reranker and the chunkers' tokenizer.
local = [
    "sentence-transformers>=6.1.0",
]
# V0 parent-child (LlamaIndex) and agentic (Chonkie) chunkers.
chunking = [
    "chonkie[openai]==1.7.0",
    "llama-index-core==0.14.25",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenk_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["archive"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML markup reads better unwrapped.
"src/tenk_agent/evaluation/render.py" = ["E501"]
# Inline XBRL fixture markup reads better unwrapped.
"tests/test_facts.py" = ["E501"]
