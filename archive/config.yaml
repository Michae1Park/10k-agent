# Every tunable parameter, per version. Guides: docs/V*.md (Knobs).
# Environment variables override the ones marked "env" (e.g. TENK_MODEL=openai:Qwen/Qwen3.5-9B).

data_dir: data                                  # env TENK_DATA_DIR

ingest:                                         # V0 · docs/V0_DATA.md
  chunk_chars: 2400                             # prose chunk size (~600 tokens at 4 chars/token)
  table_chars: 7200                             # longer tables split into row groups (header rows repeated)
  overlap_chars: 600                            # start a chunk with the previous paragraph if it is this short
  layout: flat                                  # env TENK_LAYOUT · flat (V0) | parent_child (V7, data/tenk-parent-child.db)
  parent_chars: 6000                            # V7: prose parents, split at headings (~1,500 tokens)
  child_chars: 800                              # V7: prose children searched (~200 tokens); tables: one child per row

retrieve:                                       # V1 · docs/V1_SEARCH.md
  embedder: local:Qwen/Qwen3-Embedding-0.6B     # env TENK_EMBEDDER · or voyage:voyage-3.5
  reranker: local:BAAI/bge-reranker-v2-m3       # env TENK_RERANKER · or cohere:rerank-v3.5, voyage:rerank-2.5, none
  mode: dense                                   # env TENK_RETRIEVAL · keyword | dense | hybrid
  candidates: 40                                # chunks per search before reranking
  slot_search: true                             # one search per (company, filing) named in the question
  search_children: true                         # env TENK_SEARCH_CHILDREN · V7: search children, return parents (false: parents only)
  item_filter: false                            # env TENK_ITEM_FILTER · V7: "Item 7A", "risk factors" in the question filter by Item
  device: null                                  # env TENK_LOCAL_DEVICE · where local models run: null = GPU if any, cpu

model:                                          # V2-V6
  name: openai:Qwen/Qwen3.6-27B-FP8             # env TENK_MODEL · scripts/serve_vllm.sh qwen3.6-27b-fp8 · or anthropic:<id>
  base_url: http://localhost:8001/v1            # env OPENAI_BASE_URL · vLLM / Ollama, for openai:* models
  thinking: false                               # env TENK_OPENAI_THINKING · hybrid-reasoning models: false = off, null = model default
  gpu_hourly_usd: 0.86                          # env TENK_GPU_HOURLY_USD · cost of self-hosted models = latency x rate

answer:                                         # V2 · docs/V2_RAG.md
  k: 8                                          # chunks given to the model
  context_chars: 0                              # env TENK_CONTEXT_CHARS · V7: cap on excerpt text per call (Ask and search_filings); 0 = all k

agent:                                          # V3 · docs/V3_AGENT.md
  max_tool_calls: 15                            # env TENK_MAX_TOOL_CALLS
  section_chars: 24000                          # one page of get_filing_section
  structured_data: false                        # env TENK_STRUCTURED_DATA · ablation: add the XBRL tool

verify:                                         # V4 · docs/V4_VERIFIED_AGENT.md
  enabled: true                                 # label every claim verified / calculated / cited / unverified
  repair: true                                  # research mode: send failed claims back to the agent once
  repair_calls: 4                               # extra tool calls in the repair round

eval:                                           # docs/EVAL.md
  judge_model: openai:openai/gpt-oss-20b         # env TENK_JUDGE_MODEL · fixed, whatever model is under test
  judge_base_url: http://localhost:8002/v1      # env TENK_JUDGE_BASE_URL · scripts/serve_vllm.sh gpt-oss-20b
