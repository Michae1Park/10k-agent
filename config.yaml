# Settings for the tenk CLI (TENK_CONFIG=<file> to use another). One section per stage; each
# experiment pins its own copy in experiments/v*/config.yaml. Paths are relative to the repo root.
# Specs: docs/stages/V0_PARSING_CHUNKING.md, docs/stages/V1_RETRIEVAL.md, docs/stages/V2_GENERATION.md.

data_dir: data                                          # tenk fetch → data/raw/filings/<TICKER>/FY<year>/
build:                                                  # tenk build
  out: data/v0-chunking                                 # per-filing work files, and <method>.db
  methods: [parent_child]                               # rule | parent_child | agentic (V1's best: parent_child)
db: data/v0-chunking/parent_child.db                    # what search, ask and chat read

llm:                                                    # V0 structure agent and agentic chunker
  model: Qwen/Qwen3.6-27B-FP8                           # scripts/serve_vllm.sh qwen3.6-27b-fp8
  base_url: http://localhost:8001/v1

labeling:                                               # V0 structure agent
  window: 150                                           # blocks labeled per call (windows don't overlap)
  context: 10                                           # labeled blocks from the previous window shown as context
  repair_rounds: 2                                      # validate → repair rounds per window, at most

chunking:                                               # V0 chunkers
  tokenizer: Qwen/Qwen3-Embedding-0.6B                  # counts all token sizes: the embedder's, so sizes are what it sees
  target: 600                                           # rule-based and agentic chunk size, tokens
  parent: 1280                                          # parent-child: parent size, tokens (5:1 with child)
  child: 256                                            # parent-child: child size, tokens (what search matches)
  child_overlap: 20                                     # parent-child: tokens shared by neighbouring children
  candidate_size: 128                                   # agentic: candidate pieces over this many tokens split further
  caption_chars: 300                                    # C3: longest paragraph that counts as a table caption
  table_chars: 7200                                     # C4: longer tables split into row groups
  overlap_chars: 600                                    # C7: longest paragraph carried into the next chunk

retrieval:                                              # V1
  embedder: local:Qwen/Qwen3-Embedding-0.6B             # must match the vectors in db (tenk build --stage embed)
  reranker: local:BAAI/bge-reranker-v2-m3               # cross-encoder over (question, header + chunk)
  candidates: 40                                        # per retriever, per sub-question; and the fused list cut before reranking
  rrf_k: 60                                             # reciprocal rank fusion constant
  slot_search: true                                     # one search per (company, filing) the question names
  decompose:
    rewrite: true                                       # each company's sub-question names only that company
    fan_out: true                                       # "which company…" with no company named: one sub-question per company
  k: 8                                                  # chunks returned, and given to the model
  device: null                                          # null = GPU if any; cpu when vLLM fills the GPU

generation:                                             # V2
  model: openai:Qwen/Qwen3.6-27B-FP8                    # scripts/serve_vllm.sh qwen3.6-27b-fp8 · or anthropic:<id>
  base_url: http://localhost:8001/v1                    # vLLM, for openai:* models
  thinking: false                                       # Qwen's reasoning mode; null = model default
  max_tokens: 4000
  prompt: src/tenk_agent/prompts/answer.md              # rules + answer format; {corpus} = the filings table

agent:                                                  # V3
  tools: full                                           # full | text (no xbrl_facts, edgar_filings): the ablation
  section_chunks: 4                                     # chunks per get_section page
  max_calls: 20                                         # tool-call budget; calls past it return an error
  max_turns: 20                                         # model turns, a guard against loops
  result_chars: 16000                                   # a tool result is cut to this many characters
