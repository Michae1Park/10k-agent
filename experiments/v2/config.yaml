# V2 experiment settings, read by run.py and judge.py (--config to use another file).
# Spec: experiments/V2_GENERATION.md. Paths are relative to the repo root.

run:
  label: qwen3.6-27b-fp8                                # writes output/generation/<label>/
  db: data/v0-chunking/parent_child.db                  # V1's best chunking (build_corpus.py)
  gold: experiments/v2/testdata/generation-gold-fy2025.jsonl # V1's 46 answerable + 8 to decline
  contexts: [retrieved, oracle, none]                   # spec §2: V1's top k · missing gold swapped in · no excerpts
  workers: 4                                            # model calls in parallel

retrieval: experiments/v1/config.yaml                 # V1's settings, unchanged (its `retrieval:` section, k: 8)

generation:                                             # tenk_agent.generation, spec §3
  model: openai:Qwen/Qwen3.6-27B-FP8                    # scripts/serve_vllm.sh qwen3.6-27b-fp8 · or anthropic:<id>
  base_url: http://localhost:8001/v1                    # vLLM, for openai:* models
  thinking: false                                       # Qwen's reasoning mode; null = model default
  max_tokens: 4000
  prompt: src/tenk_agent/prompts/answer.md              # rules + answer format; {corpus} = the filings table
  serve:                                                # the vLLM server: scripts/serve_vllm.sh qwen3.6-27b-fp8 (keep in step)
    gpu_memory_utilization: 0.80                        # 0.72 leaves too little KV cache once compiled
    max_model_len: 32768
    max_num_seqs: 4                                     # one user, or run.workers; 256 (default) OOMs at startup
    enforce_eager: false                                # CUDA graphs: ~17 tok/s vs ~11.5 eager
    prefix_caching: true

score:                                                  # score.py, spec §4
  restatements: true                                    # acceptable sources (MD&A tables, notes) count for the source they restate
  judge_model: openai:openai/gpt-oss-20b                # judge.py · scripts/serve_vllm.sh gpt-oss-20b (stop the 27B first)
  judge_base_url: http://localhost:8002/v1
