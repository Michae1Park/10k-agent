# V1 experiment settings, read by run.py (--config to use another file).
# Spec: experiments/V1_RETRIEVAL.md. Paths are relative to the repo root.

run:
  label: v0-parent_child                                # writes output/retrieval/<label>/
  db: data/v0-chunking/parent_child.db                  # build_corpus.py; also rule.db, agentic.db; production: data/tenk.db (tenk ingest + embed)
  gold: experiments/v1/v1_testdata/retrieval-gold-fy2025.jsonl # 16 questions: FY2025, AAPL/AMZN/NVDA/MSFT; 10 figure, 4 risk, 2 drivers

retrieval:                                              # retrieve.py, spec §2
  embedder: local:Qwen/Qwen3-Embedding-0.6B             # must match the vectors in db (tenk embed)
  reranker: local:BAAI/bge-reranker-v2-m3               # cross-encoder over (question, header + chunk)
  candidates: 40                                        # per retriever, per slot; and the fused list cut before reranking
  rrf_k: 60                                             # reciprocal rank fusion constant
  slot_search: true                                     # one search per (company, filing) the question names
  decompose:                                            # QueryDecomposer, spec §3
    rewrite: true                                       # each company's sub-question names only that company
    fan_out: true                                       # "which company…" with no company named: one sub-question per company
  k: 8                                                  # chunks returned (answer.k in config.yaml)
  device: null                                          # null = GPU if any; cpu when vLLM fills the GPU

score:
  recall_at: [1, 5, 8]                                  # Recall@k reported; MRR over the full top k
  restatements: true                                    # acceptable sources (MD&A tables, notes) count for the source they restate
