# V0 sanity cases: a small answer key a person can check by hand in ~20 minutes.
# Spec: experiments/V0_PARSING_CHUNKING.md §4.7. Checker: experiments/v0/sanity.py.
#
# Each case quotes a few words of the filing (`find`) and says what the chunk holding them must
# carry. Text is matched on letters and digits only, so "$1,234" = "1234" and quote styles don't
# matter.
#
# How to review (open the HTML in a browser, Ctrl+F the `find` text; `page` is the printed page in
# the footer):
#   - item:    the Item the text is in
#   - path:    the headings above it, top first, without the Item heading ([] = none: Item-level text)
#   - units:   a table's scale, from its caption or header ("in millions"); null = the table has none
#   - with:    text that must be in the same chunk (the rest of the table / risk factor)
#   - without: text that must NOT be in the same chunk (the neighbouring unit)
#   - absent:  the text must be in no chunk at all (page furniture, the index table)
# Fix anything that's wrong, set the case's `checked: true`, and when all are checked fill in
# `review`. Until then the results are a draft, not ground truth.

source: experiments/V0_testdata/aapl-fy25-excerpt.html
review:
  status: draft # → "reviewed" once every case is checked: true
  by: null
  date: null

