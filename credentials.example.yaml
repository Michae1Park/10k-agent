# Template only. Run `era setup` to type in your own credentials; it writes credentials.yaml
# (gitignored). Or copy this file to credentials.yaml and replace each REPLACE_ME.
# Never commit credentials.yaml. Environment variables (SEC_USER_AGENT, TIINGO_API_KEY,
# FRED_API_KEY) take precedence over the file.
sec_user_agent: REPLACE_ME   # your name and email, e.g. "Jane Doe jane@example.com"
tiingo_api_key: REPLACE_ME   # https://www.tiingo.com/account/api/token (internal use only)
fred_api_key: REPLACE_ME     # https://fred.stlouisfed.org/docs/api/api_key.html
