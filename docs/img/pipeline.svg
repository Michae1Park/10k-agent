  <text class="sub" x="130.0" y="416" text-anchor="middle" font-size="14" fill="#4a5a68">about the corpus</text>
  <rect class="llm" x="260" y="340" width="430" height="110" rx="7" fill="#fbe8f1" stroke="#b4538a" stroke-width="1.5"/>
  <text class="name" x="475.0" y="370" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Agent</text>
  <text class="sub" x="475.0" y="396" text-anchor="middle" font-size="14" fill="#4a5a68">LangGraph loop: model ⇄ tools, ≤ 20 calls</text>
  <text class="sub" x="475.0" y="416" text-anchor="middle" font-size="14" fill="#4a5a68">the model picks the tools and their order</text>
  <text class="sub" x="475.0" y="436" text-anchor="middle" font-size="14" fill="#4a5a68">answers with JSON claims citing IDs</text>
  <rect class="work" x="720" y="340" width="200" height="110" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
