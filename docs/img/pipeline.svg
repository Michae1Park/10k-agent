  <text class="ptitle" x="40" y="48" font-size="14.5" font-weight="600" fill="#46586a">Build: once per corpus</text>
  <rect class="ext" x="40" y="70" width="190" height="100" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="135.0" y="100" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">EDGAR 10-K HTML</text>
  <text class="sub" x="135.0" y="126" text-anchor="middle" font-size="14" fill="#4a5a68">24 filings</text>
  <text class="sub" x="135.0" y="146" text-anchor="middle" font-size="14" fill="#4a5a68">8 companies × 3 years</text>
  <rect class="work" x="266" y="70" width="190" height="100" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="361.0" y="100" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Preprocess</text>
  <text class="sub" x="361.0" y="126" text-anchor="middle" font-size="14" fill="#4a5a68">rules → blocks</text>
  <text class="sub" x="361.0" y="146" text-anchor="middle" font-size="14" fill="#4a5a68">LLM structure agent</text>
  <text class="sub" x="361.0" y="166" text-anchor="middle" font-size="14" fill="#4a5a68">validated and repaired</text>
  <rect class="work" x="492" y="70" width="190" height="100" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="587.0" y="100" text-anchor="middle" font-size="17" font-weight="600" fill="#132030">Chunk</text>
  <text class="sub" x="587.0" y="126" text-anchor="middle" font-size="14" fill="#4a5a68">parent-child</text>
  <text class="sub" x="587.0" y="146" text-anchor="middle" font-size="14" fill="#4a5a68">tables kept whole</text>
