<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1050" viewBox="0 0 1180 1050" role="img" aria-labelledby="svgtitle svgdesc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="svgtitle">V4 component map</title>
  <desc id="svgdesc">V4 component map. External sources feed Acquisition, which writes the raw cache (interface 1). Text processing and Facts and extraction build the Store, one SQLite file read only through the AsOf filter (interface 2); extraction rows are interface 6. Retrieval and the Model engine read the Store. The Agent runtime reaches Retrieval (3), the Store and the Model engine through tool calls (4) and calls the LLM (5). The user runs Ask and Research, which are agent runs, or the Report pipeline, which runs fixed steps, calls the Model engine (7, 8) and bounded sub-agents, and hands artifacts (9) to Verification (reference ids 10, fact list 11) and Export. Export writes the outputs (12): note, workbook, JSON files and a saved version, which goes back to the Store. Evaluation reads gold sets and every layer&#x27;s outputs (13). Pink components call the LLM.</desc>
