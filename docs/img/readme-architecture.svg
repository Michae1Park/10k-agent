<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12px; fill: #334155; }
      .h { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: .06em; }
      .l { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#a); }
      .src { fill: #e0f2fe; stroke: #38bdf8; }
      .bld { fill: #ecfdf5; stroke: #34d399; }
      .llm { fill: #fdf2f8; stroke: #f472b6; }
      .db  { fill: #ede9fe; stroke: #a78bfa; }
      .rt  { fill: #fefce8; stroke: #facc15; }
      .out { fill: #f1f5f9; stroke: #94a3b8; }
      rect { stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="690" fill="#ffffff"/>

  <!-- column headers -->
  <text class="h" x="20" y="34">SOURCES</text>
  <text class="h" x="220" y="34">OFFLINE BUILD</text>
  <text class="h" x="470" y="34">STORE</text>
  <text class="h" x="660" y="34">ENTRY POINTS · AGENT · MODEL</text>

  <!-- sources -->
  <rect class="src" x="20" y="54" width="170" height="92" rx="10"/>
  <text class="t" x="34" y="78">SEC EDGAR</text>
  <text class="s" x="34" y="98">10-K, 10-Q, earnings</text>
  <text class="s" x="34" y="114">releases, proxies, Form 4,</text>
  <text class="s" x="34" y="130">XBRL company facts</text>
  <rect class="src" x="20" y="162" width="170" height="92" rx="10"/>
  <text class="t" x="34" y="186">Market and macro</text>
  <text class="s" x="34" y="206">Prices (Tiingo, local only),</text>
  <text class="s" x="34" y="222">FRED / ALFRED, ERP</text>
  <rect class="src" x="20" y="270" width="170" height="74" rx="10"/>
  <text class="t" x="34" y="294">Cross-checks</text>
  <text class="s" x="34" y="314">BTS airline passengers,</text>
  <text class="s" x="34" y="330">NYC TLC trips</text>

  <!-- build -->
  <rect class="bld" x="220" y="54" width="220" height="60" rx="10"/>
  <text class="t" x="234" y="78">Text: Items → chunks</text>
  <text class="s" x="234" y="98">parent-child chunks, FTS5, vectors</text>
  <rect class="bld" x="220" y="126" width="220" height="60" rx="10"/>
  <text class="t" x="234" y="150">Facts</text>
  <text class="s" x="234" y="170">XBRL + inline XBRL, Q4 derived</text>
  <rect class="llm" x="220" y="198" width="220" height="60" rx="10"/>
  <text class="t" x="234" y="222">KPI and guidance extraction</text>
  <text class="s" x="234" y="242">LLM, validated against the table</text>
  <rect class="bld" x="220" y="270" width="220" height="60" rx="10"/>
  <text class="t" x="234" y="294">Market series</text>
  <text class="s" x="234" y="314">each value at its publish date</text>

  <path class="l" d="M190,100 H220"/>
  <path class="l" d="M190,120 L220,156"/>
  <path class="l" d="M190,130 L220,224"/>
  <path class="l" d="M190,208 L220,296"/>
  <path class="l" d="M190,307 L220,304"/>

  <!-- store -->
  <rect class="db" x="470" y="54" width="160" height="276" rx="12"/>
  <text class="t" x="486" y="80">SQLite store</text>
  <text class="s" x="486" y="104">chunks · vectors</text>
  <text class="s" x="486" y="122">facts · KPIs · guidance</text>
  <text class="s" x="486" y="140">market series</text>
  <text class="s" x="486" y="158">saved model versions</text>
  <rect x="482" y="252" width="136" height="64" rx="8" fill="#ffffff" stroke="#a78bfa"/>
  <text class="t" x="494" y="276">AsOf filter</text>
  <text class="s" x="494" y="294">only data filed</text>
  <text class="s" x="494" y="308">before the as-of date</text>
  <path class="l" d="M440,84 H470"/>
  <path class="l" d="M440,156 H470"/>
  <path class="l" d="M440,228 H470"/>
  <path class="l" d="M440,300 H470"/>

  <!-- entry points -->
  <rect class="out" x="660" y="54" width="520" height="44" rx="10"/>
  <text class="t" x="676" y="81">Web app (React + FastAPI, live trace)  ·  CLI (era)</text>

  <rect class="rt" x="660" y="116" width="118" height="56" rx="10"/>
  <text class="t" x="676" y="140">Ask</text>
  <text class="s" x="676" y="158">filed data</text>
  <rect class="rt" x="790" y="116" width="118" height="56" rx="10"/>
  <text class="t" x="806" y="140">Research</text>
  <text class="s" x="806" y="158">model answers</text>
  <rect class="llm" x="920" y="116" width="128" height="56" rx="10"/>
  <text class="t" x="934" y="140">Investigate</text>
  <text class="s" x="934" y="158">plans sub-runs</text>
  <rect class="rt" x="1060" y="116" width="120" height="56" rx="10"/>
  <text class="t" x="1076" y="140">Report</text>
  <text class="s" x="1076" y="158">ticker + as-of</text>
  <path class="l" d="M719,98 V116"/>
  <path class="l" d="M849,98 V116"/>
  <path class="l" d="M984,98 V116"/>
  <path class="l" d="M1120,98 V116"/>

  <!-- investigate fan-out -->
  <path class="l" d="M940,172 C940,190 800,186 790,202" stroke-dasharray="5 4"/>
  <path class="l" d="M1010,172 C1010,192 900,186 880,202" stroke-dasharray="5 4"/>

  <!-- agent -->
  <rect class="llm" x="660" y="204" width="370" height="78" rx="10"/>
  <text class="t" x="676" y="228">Agent loop</text>
  <text class="s" x="676" y="248">tool calls → JSON answer whose claims cite ids;</text>
  <text class="s" x="676" y="266">Investigate combines its sub-run answers</text>
  <path class="l" d="M719,172 V204"/>
  <path class="l" d="M849,172 V204"/>

  <!-- toolbox -->
  <rect class="rt" x="660" y="300" width="370" height="60" rx="10"/>
  <text class="t" x="676" y="324">Toolbox</text>
  <text class="s" x="676" y="344">search filings · KPIs · facts · calculator · model · valuation</text>
  <path class="l" d="M845,282 V300"/>
  <path class="l" d="M660,330 H630"/>

  <!-- model engine -->
  <rect class="bld" x="660" y="378" width="370" height="60" rx="10"/>
  <text class="t" x="676" y="402">Model engine (code, no LLM)</text>
  <text class="s" x="676" y="422">history + integrity checks · forecast · DCF + peer multiples</text>
  <path class="l" d="M845,360 V378"/>
  <path class="l" d="M660,408 C600,408 560,380 555,330"/>

  <!-- report pipeline -->
  <rect class="rt" x="1060" y="204" width="120" height="234" rx="10"/>
  <text class="t" x="1076" y="228">Report</text>
  <text class="t" x="1076" y="246">pipeline</text>
  <text class="s" x="1076" y="270">S1–S11, fixed</text>
  <text class="s" x="1076" y="288">LLM only for</text>
  <text class="s" x="1076" y="304">events, forecast</text>
  <text class="s" x="1076" y="320">proposals,</text>
  <text class="s" x="1076" y="336">debates and</text>
  <text class="s" x="1076" y="352">the write-up</text>
  <path class="l" d="M1120,172 V204"/>
  <path class="l" d="M1060,408 H1030"/>

  <!-- claim check -->
  <rect class="bld" x="660" y="470" width="370" height="60" rx="10"/>
  <text class="t" x="676" y="494">Claim check</text>
  <text class="s" x="676" y="514">each number vs what it cites: verified · cited · unverified</text>
  <path class="l" d="M670,282 C630,300 630,470 660,494" stroke-dasharray="0"/>
  <path class="l" d="M1120,438 V470 H1030"/>

  <!-- outputs -->
  <rect class="out" x="660" y="562" width="240" height="76" rx="10"/>
  <text class="t" x="676" y="586">Cited answer</text>
  <text class="s" x="676" y="606">or a decline when the data</text>
  <text class="s" x="676" y="622">can't answer</text>
  <rect class="out" x="920" y="562" width="260" height="76" rx="10"/>
  <text class="t" x="936" y="586">Draft note, workbook, log</text>
  <text class="s" x="936" y="606">10 sections, every figure traced;</text>
  <text class="s" x="936" y="622">human approves rating and PT</text>
  <path class="l" d="M780,530 V562"/>
  <path class="l" d="M1050,530 V562"/>
  <path class="l" d="M1050,638 V672 H550 V330" stroke-dasharray="5 4"/>
  <text class="s" x="562" y="664">saved model version, citable by Ask and Research</text>

  <!-- legend -->
  <rect class="src" x="20" y="400" width="18" height="14" rx="3"/><text class="s" x="46" y="412">external source</text>
  <rect class="bld" x="20" y="424" width="18" height="14" rx="3"/><text class="s" x="46" y="436">code, no LLM</text>
  <rect class="llm" x="20" y="448" width="18" height="14" rx="3"/><text class="s" x="46" y="460">calls the LLM</text>
  <rect class="rt" x="20" y="472" width="18" height="14" rx="3"/><text class="s" x="46" y="484">mode / runner</text>
  <rect class="db" x="20" y="496" width="18" height="14" rx="3"/><text class="s" x="46" y="508">data</text>
  <text class="s" x="20" y="540">Dashed: Investigate's sub-runs,</text>
  <text class="s" x="20" y="556">saved versions fed back.</text>
</svg>
