<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660" role="img" aria-labelledby="svgtitle svgdesc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="svgtitle">Research model tools</title>
  <desc id="svgdesc">Zoom of the Research-mode model tools. run_scenario validates overrides against the driver list and bounds, copies the base model into a session-local run, reruns forecast, checks and valuation as code, and returns changed lines, price target and rating against base with a scratch model id; it never creates a model version. compare_peers builds or reuses cached default models for the eight companies at the same as-of and returns a table. variance_review compares the prior model version with the actuals by driver and returns the bridge by sequential substitution.</desc>
  <style>
    .plan { stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0f1419; stroke: #2b3540; }
      .panel { fill: #151c24; stroke: #3a4753; }
      .ext   { fill: #16283c; stroke: #6f9dc8; }
      .work  { fill: #16301f; stroke: #63ab77; }
      .llm   { fill: #3a1a2c; stroke: #d487b0; }
      .sink  { fill: #241b33; stroke: #a186c4; }
      .gate  { fill: #3a2f14; stroke: #d4a84a; }
      .name  { fill: #e6edf3; }
      .sub   { fill: #9fb0c0; }
      .ptitle{ fill: #93a4b4; }
      .edge  { stroke: #8496a6; }
      .elabel{ fill: #93a4b4; }
      #arrow > path { fill: #8496a6; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b7a"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="1179" height="659" rx="10" fill="#ffffff" stroke="#e3e9ef"/>
  <rect class="panel" x="20" y="20" width="1140" height="166" rx="10" fill="#f7f9fb" stroke="#c7d3de" stroke-width="1.5"/>
  <text class="ptitle" x="40" y="46" font-size="14.5" font-weight="600" fill="#46586a">run_scenario(company, overrides): a what-if that is never saved as a version</text>
  <rect class="llm" x="40" y="64" width="190" height="108" rx="7" fill="#fbe8f1" stroke="#b4538a" stroke-width="1.5"/>
  <text class="name" x="135.0" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Overrides</text>
  <text class="sub" x="135.0" y="112" text-anchor="middle" font-size="13" fill="#4a5a68">{driver: value or delta}</text>
  <text class="sub" x="135.0" y="130" text-anchor="middle" font-size="13" fill="#4a5a68">chosen by the agent</text>
  <rect class="work" x="262" y="64" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="357.0" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Validate</text>
  <text class="sub" x="357.0" y="112" text-anchor="middle" font-size="13" fill="#4a5a68">driver in the list, within</text>
  <text class="sub" x="357.0" y="130" text-anchor="middle" font-size="13" fill="#4a5a68">bounds; unknown driver:</text>
  <text class="sub" x="357.0" y="148" text-anchor="middle" font-size="13" fill="#4a5a68">returns the valid ones</text>
  <rect class="work" x="484" y="64" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="579.0" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Copy base model</text>
  <text class="sub" x="579.0" y="112" text-anchor="middle" font-size="13" fill="#4a5a68">model.json of the base run</text>
  <text class="sub" x="579.0" y="130" text-anchor="middle" font-size="13" fill="#4a5a68">at this as-of, held in</text>
  <text class="sub" x="579.0" y="148" text-anchor="middle" font-size="13" fill="#4a5a68">the session only</text>
  <rect class="work" x="706" y="64" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="801.0" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Rerun S5 → S7</text>
  <text class="sub" x="801.0" y="112" text-anchor="middle" font-size="13" fill="#4a5a68">forecast, checks, valuation</text>
  <text class="sub" x="801.0" y="130" text-anchor="middle" font-size="13" fill="#4a5a68">same code as Report</text>
  <text class="sub" x="801.0" y="148" text-anchor="middle" font-size="13" fill="#4a5a68">nothing from the LLM</text>
  <rect class="ext" x="928" y="64" width="190" height="108" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="1023.0" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Result</text>
  <text class="sub" x="1023.0" y="112" text-anchor="middle" font-size="13" fill="#4a5a68">changed lines, PT, rating</text>
  <text class="sub" x="1023.0" y="130" text-anchor="middle" font-size="13" fill="#4a5a68">vs base, with an id:</text>
  <text class="sub" x="1023.0" y="148" text-anchor="middle" font-size="13" fill="#4a5a68">model:UBER:…:scratch-1:…</text>
  <path class="edge" d="M 230 118.0 L 262 118.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 452 118.0 L 484 118.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 674 118.0 L 706 118.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 896 118.0 L 928 118.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect class="panel" x="20" y="204" width="1140" height="166" rx="10" fill="#f7f9fb" stroke="#c7d3de" stroke-width="1.5"/>
  <text class="ptitle" x="40" y="230" font-size="14.5" font-weight="600" fill="#46586a">compare_peers(metric, companies): the eight at one as-of</text>
  <rect class="llm" x="40" y="248" width="190" height="108" rx="7" fill="#fbe8f1" stroke="#b4538a" stroke-width="1.5"/>
  <text class="name" x="135.0" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Request</text>
  <text class="sub" x="135.0" y="296" text-anchor="middle" font-size="13" fill="#4a5a68">metric and companies</text>
  <text class="sub" x="135.0" y="314" text-anchor="middle" font-size="13" fill="#4a5a68">e.g. 2027E EV / EBITDA</text>
  <rect class="gate" x="262" y="248" width="190" height="108" rx="7" fill="#fbf1d9" stroke="#b58a24" stroke-width="1.5"/>
  <text class="name" x="357.0" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Cache key</text>
  <text class="sub" x="357.0" y="296" text-anchor="middle" font-size="13" fill="#4a5a68">(ticker, as-of,</text>
  <text class="sub" x="357.0" y="314" text-anchor="middle" font-size="13" fill="#4a5a68">inputs hash)</text>
  <rect class="work" x="484" y="248" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="579.0" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Hit or build</text>
  <text class="sub" x="579.0" y="296" text-anchor="middle" font-size="13" fill="#4a5a68">hit: read the saved run</text>
  <text class="sub" x="579.0" y="314" text-anchor="middle" font-size="13" fill="#4a5a68">miss: S1, S3, S5, S7 with</text>
  <text class="sub" x="579.0" y="332" text-anchor="middle" font-size="13" fill="#4a5a68">defaults, no LLM; slow once</text>
  <rect class="work" x="706" y="248" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="801.0" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Table</text>
  <text class="sub" x="801.0" y="296" text-anchor="middle" font-size="13" fill="#4a5a68">one row per company,</text>
  <text class="sub" x="801.0" y="314" text-anchor="middle" font-size="13" fill="#4a5a68">same as-of, same code,</text>
  <text class="sub" x="801.0" y="332" text-anchor="middle" font-size="13" fill="#4a5a68">peer median and range</text>
  <rect class="ext" x="928" y="248" width="190" height="108" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="1023.0" y="274" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Result</text>
  <text class="sub" x="1023.0" y="296" text-anchor="middle" font-size="13" fill="#4a5a68">compact table plus ids</text>
  <text class="sub" x="1023.0" y="314" text-anchor="middle" font-size="13" fill="#4a5a68">detail=true for a line</text>
  <text class="sub" x="1023.0" y="332" text-anchor="middle" font-size="13" fill="#4a5a68">longer tool timeout</text>
  <path class="edge" d="M 230 302.0 L 262 302.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 452 302.0 L 484 302.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 674 302.0 L 706 302.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 896 302.0 L 928 302.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect class="panel" x="20" y="388" width="1140" height="166" rx="10" fill="#f7f9fb" stroke="#c7d3de" stroke-width="1.5"/>
  <text class="ptitle" x="40" y="414" font-size="14.5" font-weight="600" fill="#46586a">variance_review(company, period): why an estimate moved</text>
  <rect class="llm" x="40" y="432" width="190" height="108" rx="7" fill="#fbe8f1" stroke="#b4538a" stroke-width="1.5"/>
  <text class="name" x="135.0" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Request</text>
  <text class="sub" x="135.0" y="480" text-anchor="middle" font-size="13" fill="#4a5a68">company and period</text>
  <text class="sub" x="135.0" y="498" text-anchor="middle" font-size="13" fill="#4a5a68">(research_report gives</text>
  <text class="sub" x="135.0" y="516" text-anchor="middle" font-size="13" fill="#4a5a68">the saved estimate)</text>
  <rect class="sink" x="262" y="432" width="190" height="108" rx="7" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="name" x="357.0" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Prior version</text>
  <text class="sub" x="357.0" y="480" text-anchor="middle" font-size="13" fill="#4a5a68">latest model version with</text>
  <text class="sub" x="357.0" y="498" text-anchor="middle" font-size="13" fill="#4a5a68">as_of before this run,</text>
  <text class="sub" x="357.0" y="516" text-anchor="middle" font-size="13" fill="#4a5a68">estimates by driver</text>
  <rect class="sink" x="484" y="432" width="190" height="108" rx="7" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="name" x="579.0" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Actuals</text>
  <text class="sub" x="579.0" y="480" text-anchor="middle" font-size="13" fill="#4a5a68">quarters, kpis, guidance</text>
  <text class="sub" x="579.0" y="498" text-anchor="middle" font-size="13" fill="#4a5a68">visible at this as-of</text>
  <rect class="work" x="706" y="432" width="190" height="108" rx="7" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="name" x="801.0" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Bridge</text>
  <text class="sub" x="801.0" y="480" text-anchor="middle" font-size="13" fill="#4a5a68">sequential substitution:</text>
  <text class="sub" x="801.0" y="498" text-anchor="middle" font-size="13" fill="#4a5a68">actuals, guidance, then each</text>
  <text class="sub" x="801.0" y="516" text-anchor="middle" font-size="13" fill="#4a5a68">assumption in register order</text>
  <rect class="ext" x="928" y="432" width="190" height="108" rx="7" fill="#e6eef8" stroke="#4a7bab" stroke-width="1.5"/>
  <text class="name" x="1023.0" y="458" text-anchor="middle" font-size="16" font-weight="600" fill="#132030">Result</text>
  <text class="sub" x="1023.0" y="480" text-anchor="middle" font-size="13" fill="#4a5a68">prior vs actual by driver</text>
  <text class="sub" x="1023.0" y="498" text-anchor="middle" font-size="13" fill="#4a5a68">timing / recurring / mixed</text>
  <text class="sub" x="1023.0" y="516" text-anchor="middle" font-size="13" fill="#4a5a68">confidence by horizon</text>
  <path class="edge" d="M 230 486.0 L 262 486.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 452 486.0 L 484 486.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 674 486.0 L 706 486.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path class="edge" d="M 896 486.0 L 928 486.0" fill="none" stroke="#5a6b7a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="sub" x="40" y="604" text-anchor="start" font-size="12.5" fill="#4a5a68">All of these tools are planned (V4.5). Each is bound to the run's AsOf, never raises, and returns citable ids.</text>
  <rect class="work" x="40" y="628" width="26" height="14" rx="3" fill="#e7f3ea" stroke="#4f8f61" stroke-width="1.5"/>
  <text class="sub" x="74" y="640" font-size="12.5" fill="#4a5a68">code</text>
  <rect class="llm" x="190" y="628" width="26" height="14" rx="3" fill="#fbe8f1" stroke="#b4538a" stroke-width="1.5"/>
  <text class="sub" x="224" y="640" font-size="12.5" fill="#4a5a68">LLM</text>
  <rect class="sink" x="340" y="628" width="26" height="14" rx="3" fill="#f0eaf7" stroke="#7c62a0" stroke-width="1.5"/>
  <text class="sub" x="374" y="640" font-size="12.5" fill="#4a5a68">store</text>
  <rect class="gate" x="490" y="628" width="26" height="14" rx="3" fill="#fbf1d9" stroke="#b58a24" stroke-width="1.5"/>
  <text class="sub" x="524" y="640" font-size="12.5" fill="#4a5a68">date or check</text>
</svg>
